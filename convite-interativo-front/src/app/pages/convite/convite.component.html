<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-cyan-400 to-blue-500">
  <!-- Container do convite -->
  <div class="relative max-w-md w-full">
    <!-- Imagem do convite -->
    <img 
      src="fundoteste.png"
      alt="Convite de aniversário" 
      class="w-full rounded-3xl shadow-2xl"
    >
    
    <!-- Formulário sobreposto -->
    <div class="absolute bottom-8 left-0 right-0 px-8">
      <!-- Campo de nome -->
      <input 
        type="text" 
        [(ngModel)]="nomeConvidado"
        placeholder="Digite seu nome"
        class="w-full px-4 py-3 rounded-xl border-2 border-blue-300 focus:border-blue-500 focus:outline-none text-center text-lg font-semibold shadow-lg mb-4"
      >
      
      <!-- Botão confirmar -->
      <button 
        (click)="confirmarPresenca()"
        class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 text-lg"
      >
        🎉 Confirmar Presença 🎉
      </button>
    </div>

    <!-- Mensagem de sucesso/erro -->
    <div 
      *ngIf="showMensagem"
      class="absolute top-4 left-4 right-4 bg-white border-2 border-green-500 rounded-xl p-4 shadow-lg text-center font-bold text-green-700 animate-bounce"
    >
      {{ mensagem }}
    </div>
  </div>
</div>
