<div class="bg flex items-center justify-center p-4">
  <div class="max-w-6xl w-full">
    <div class="grid md:grid-cols-2 gap-8 items-start">

      <!-- COLUNA ESQUERDA: Imagem do convite -->
      <div class="order-1">
        <div class="transform hover:scale-105 transition-transform duration-300">

          <div class="relative">
            <img src="assets/fundo.png" alt="Convite de aniversário" class="w-full rounded-3xl shadow-2xl" />
            <a href="https://share.google/67sE4UenSgbTJRCpK" target="_blank" rel="noopener noreferrer"
              class="absolute rounded-full" style="top: 63%; left: 35%; width: 60px; aspect-ratio: 1;"
              title="Ver localização"></a>
            <button (click)="abrirModal()" class="absolute rounded-full cursor-pointer"
              style="top: 63%; left: 51%; width: 60px; aspect-ratio: 1;" title="Sugestões de presentes"></button>
          </div>

        </div>
      </div>

      <!-- COLUNA DIREITA: Formulário -->
      <div class="order-2">
        <div class="bg-white rounded-3xl shadow-2xl p-6" style="
            height: 231px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 410px
          ">
          <!-- Cabeçalho -->
          <div class="text-center">
            <h2 class="text-2xl font-bold mb-1" style="color: #b87fd4;">Confirme sua Presença!</h2>
            <p class="text-gray-600 text-sm">Vai ser uma festa inesquecível!</p>
          </div>

          <!-- Formulário -->
          <div class="space-y-3">
            <!-- Campo nome -->
            <div>
              <label class="block text-gray-700 font-semibold mb-1 text-left text-sm">
                Seu nome:
              </label>
              <input type="text" [(ngModel)]="nomeConvidado" placeholder="Digite seu nome completo"
                class="w-full px-3 py-2 rounded-xl border-2 focus:outline-none text-base transition-colors"
                style="border-color: #DBBCE3; outline-color: #b87fd4;"
                (focus)="$event.target.style.borderColor='#b87fd4'" (blur)="$event.target.style.borderColor='#DBBCE3'"
                (keyup.enter)="confirmarPresenca()" />
            </div>

            <!-- Botão confirmar -->
            <button (click)="confirmarPresenca()"
              class="w-full text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 text-base cursor-pointer"
              style="background: linear-gradient(to right, #DBBCE3, #b87fd4);">
              Confirmar Presença
            </button>
          </div>

          <!-- Mensagem de sucesso/erro -->
          <div *ngIf="showMensagem" class="bg-green-100 border-2 border-green-500 rounded-xl p-2 text-center">
            <p class="text-green-700 font-bold text-sm">{{ mensagem }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>


<div *ngIf="modalAberta" class="fixed inset-0 flex items-center justify-center z-50" (click)="fecharModal()">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

  <div class="relative bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full mx-4 z-10"
    (click)="$event.stopPropagation()">
    <button (click)="fecharModal()"
      class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">
      &times;
    </button>

    <div class="text-center">
      <img src="assets/sugestao_presente.png" alt="Sugestões de presentes" class="w-full rounded-2xl" />
    </div>
  </div>
</div>
